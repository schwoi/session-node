services:
  # ── L2 Proxy ───────────────────────────────────────────────────
  # Runs oxend as an L2 proxy that forwards Arbitrum data to service nodes.
  # Automatic local key discovery and reciprocal configuration:
  #   python3 configure_l2_proxy.py
  # This writes docker-compose.override.yml and enables the proxy automatically.
  l2proxy:
    profiles: [proxy]
    image: ${SESSION_NODE_IMAGE:-ghcr.io/schwoi/session-node:latest}
    build: .
    ports:
      - "22125:22125/tcp"
    restart: unless-stopped
    stop_grace_period: 2m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./l2proxy:/var/lib/oxen
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    environment:
      - NETWORK=mainnet
      - ROLE=proxy
      - QUORUMNET_PORT=22125
      - P2P_PORT=22126
      - L2_PROVIDER=${L2_PROVIDER:-}
      # Comma-separated ed25519 pubkeys of nodes allowed to use this proxy
      - L2_PROXY_CLIENTS=${L2_PROXY_CLIENTS:-}
      # Uncomment for debug logging during initial setup
      # - L2_PROXY_LOG=1

  # ── Mainnet Nodes ──────────────────────────────────────────────
  oxen00:
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    image: ${SESSION_NODE_IMAGE:-ghcr.io/schwoi/session-node:latest}
    build: .
    ports:
      - "22020:22020/tcp"
      - "22020:22020/udp"
      - "22021:22021/tcp"
      - "22022:22022/tcp"
      - "22025:22025/tcp"
      - "1090:1090/udp"
      - "1190:1190/udp"
    restart: unless-stopped
    stop_grace_period: 2m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./oxen00:/var/lib/oxen
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    environment:
      - NETWORK=mainnet
      - SERVICE_NODE_IP_ADDRESS=${SERVICE_NODE_IP_ADDRESS:-}
      - QUORUMNET_PORT=22025
      - P2P_PORT=22022
      - STORAGE_LMQ_PORT=22020
      - STORAGE_HTTPS_PORT=22021
      - LOKINET_PORT=1090
      - SESSION_ROUTER_PORT=1190
      # Option A: Direct RPC (no proxy)
      - L2_PROVIDER=${L2_PROVIDER:-}
      # Option B: Use L2 proxy (comment out L2_PROVIDER above, uncomment below)
      # - L2_OXEND=l2proxy:22125/PUBKEY_OF_L2PROXY

  oxen01:
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    image: ${SESSION_NODE_IMAGE:-ghcr.io/schwoi/session-node:latest}
    build: .
    ports:
      - "22030:22030/tcp"
      - "22030:22030/udp"
      - "22031:22031/tcp"
      - "22032:22032/tcp"
      - "22035:22035/tcp"
      - "1091:1091/udp"
      - "1191:1191/udp"
    restart: unless-stopped
    stop_grace_period: 2m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./oxen01:/var/lib/oxen
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    environment:
      - NETWORK=mainnet
      - SERVICE_NODE_IP_ADDRESS=${SERVICE_NODE_IP_ADDRESS:-}
      - QUORUMNET_PORT=22035
      - P2P_PORT=22032
      - STORAGE_LMQ_PORT=22030
      - STORAGE_HTTPS_PORT=22031
      - LOKINET_PORT=1091
      - SESSION_ROUTER_PORT=1191
      # Option A: Direct RPC (no proxy)
      - L2_PROVIDER=${L2_PROVIDER:-}
      # Option B: Use L2 proxy (comment out L2_PROVIDER above, uncomment below)
      # - L2_OXEND=l2proxy:22125/PUBKEY_OF_L2PROXY

  # ── Stagenet Nodes ─────────────────────────────────────────────
  stagenet00:
    profiles: [stagenet]
    image: ${SESSION_NODE_IMAGE:-ghcr.io/schwoi/session-node:latest}
    build: .
    ports:
      - "11022:11022/tcp"
      - "11025:11025/tcp"
    restart: unless-stopped
    stop_grace_period: 2m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./stagenet00:/var/lib/oxen
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    environment:
      - NETWORK=stagenet
      - SERVICE_NODE_IP_ADDRESS=${SERVICE_NODE_IP_ADDRESS:-}
      - QUORUMNET_PORT=11025
      - P2P_PORT=11022
      - L2_PROVIDER=${STAGENET_L2_PROVIDER:-}

  stagenet01:
    profiles: [stagenet]
    image: ${SESSION_NODE_IMAGE:-ghcr.io/schwoi/session-node:latest}
    build: .
    ports:
      - "11032:11032/tcp"
      - "11035:11035/tcp"
    restart: unless-stopped
    stop_grace_period: 2m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./stagenet01:/var/lib/oxen
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    environment:
      - NETWORK=stagenet
      - SERVICE_NODE_IP_ADDRESS=${SERVICE_NODE_IP_ADDRESS:-}
      - QUORUMNET_PORT=11035
      - P2P_PORT=11032
      - L2_PROVIDER=${STAGENET_L2_PROVIDER:-}
